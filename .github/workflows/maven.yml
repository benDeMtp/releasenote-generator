name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - 'regular'
          - 'release'
        default: 'regular'
      dryrun:
        description: 'Test mode (no commit or push)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
      next-version: ${{ steps.get-next-version.outputs.NEXT_VERSION }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Set automatic dryrun for non-main branches
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && github.ref != 'refs/heads/main' && github.event.inputs.dryrun != 'true'
      run: |
        echo "Setting automatic dryrun mode for non-main branch"
        echo "AUTO_DRYRUN=true" >> $GITHUB_ENV
        
    - name: Detect effective dryrun mode
      id: dryrun-mode
      run: |
        if [[ "${{ github.event.inputs.dryrun }}" == "true" || "${{ env.AUTO_DRYRUN }}" == "true" ]]; then
          echo "EFFECTIVE_DRYRUN=true" >> $GITHUB_OUTPUT
        else
          echo "EFFECTIVE_DRYRUN=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Validate release conditions
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
      run: |
        if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
          if [[ "${{ steps.dryrun-mode.outputs.EFFECTIVE_DRYRUN }}" == "true" ]]; then
            echo "⚠️ Non-main branch detected: ${{ github.ref }}"
            echo "✅ Continuing in dry run mode"
          else
            echo "::error::Releases are only allowed on the main branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
        else
          echo "✅ Branch validation passed: Releasing from main branch"
        fi
    
    - name: Configure Git
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    
    - name: Get current version
      id: get-current-version
      run: echo "CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
    
    - name: Process release version
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && contains(steps.get-current-version.outputs.CURRENT_VERSION, '-SNAPSHOT')
      run: |
        RELEASE_VERSION=$(echo ${{ steps.get-current-version.outputs.CURRENT_VERSION }} | sed 's/-SNAPSHOT//')
        mvn versions:set -DnewVersion=${RELEASE_VERSION} -DgenerateBackupPoms=false
        echo "Setting release version to ${RELEASE_VERSION}"
        git add pom.xml
        git commit -m "Release version ${RELEASE_VERSION}"
    
    - name: Show changes (dry run)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && steps.dryrun-mode.outputs.EFFECTIVE_DRYRUN == 'true'
      run: |
        RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "🔍 DRY RUN: Would commit release version: ${RELEASE_VERSION}"
        git diff pom.xml
    
    - name: Calculate next development version
      id: get-next-version
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
      run: |
        CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        # Split version into major.minor.patch
        IFS='.' read -r -a version_parts <<< "$CURRENT_VERSION"
        MAJOR="${version_parts[0]}"
        MINOR="${version_parts[1]}"
        
        # Increment minor version
        NEXT_MINOR=$((MINOR + 1))
        NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"
        echo "NEXT_VERSION=${NEXT_VERSION}" >> $GITHUB_OUTPUT
        echo "Next development version will be ${NEXT_VERSION}"
        
    - name: Extract final Maven project version
      id: get-version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: native
      run: mvn package -DskipTests=true -Dnative -Dquarkus.native.container-build=true
      
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux x86 binary
        path: |
          target/*-runner
          
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'regular' && steps.dryrun-mode.outputs.EFFECTIVE_DRYRUN != 'true')
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Set up QEMU
      if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'regular' && steps.dryrun-mode.outputs.EFFECTIVE_DRYRUN != 'true')
      uses: docker/setup-qemu-action@v3
      
    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'regular' && steps.dryrun-mode.outputs.EFFECTIVE_DRYRUN != 'true')
      uses: docker/setup-buildx-action@v3
      
    - name: Build and push Docker image
      if: (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'regular')) && steps.dryrun-mode.outputs.EFFECTIVE_DRYRUN != 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/main/docker/Dockerfile.native-micro
        push: true
        tags: |
          kawamind/releasenote-generator:latest
          kawamind/releasenote-generator:${{ steps.get-version.outputs.VERSION }}
          
  release-finalize:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && github.ref == 'refs/heads/main' && github.event.inputs.dryrun != 'true'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Create Git tag
      run: |
        git tag -a v${{ needs.build.outputs.version }} -m "Release version ${{ needs.build.outputs.version }}"
        
    - name: Set next development version
      run: |
        mvn versions:set -DnewVersion=${{ needs.build.outputs.next-version }} -DgenerateBackupPoms=false
        git add pom.xml
        git commit -m "Prepare for next development version ${{ needs.build.outputs.next-version }}"
        
    - name: Push changes and tags
      run: |
        git push origin main
        git push origin v${{ needs.build.outputs.version }}
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.build.outputs.version }}
        name: Release v${{ needs.build.outputs.version }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  release-dryrun:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && (github.event.inputs.dryrun == 'true' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Show release information
      run: |
        echo "🔍 DRY RUN MODE ACTIVATED"
        echo "✅ Build completed successfully"
        echo "📦 Release version would be: ${{ needs.build.outputs.version }}"
        echo "🏷️ Would create tag: v${{ needs.build.outputs.version }}"
        echo "🚀 Next development version would be: ${{ needs.build.outputs.next-version }}"
        echo "🐳 Docker image would be tagged as: kawamind/releasenote-generator:${{ needs.build.outputs.version }}"
        echo ""
        echo "ℹ️ No commits, tags, or Docker images were created in this dry run."